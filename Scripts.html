<script>
// 画面全体で共有する現在ページ、起動情報、検索条件、直近取得データを保持する。
const state = {
  boot: null,
  page: 'dashboard',
  cache: {},
  skillMemberId: '',
  initialRoute: window.__INITIAL_ROUTE__ || null,
  restoringHistory: false,
  entering: false,
  identityConfigured: null,
  feedbackFilter: 'open',
  lastServerView: null
};

// CSSセレクターに一致する最初の要素を取得する短縮関数。
const $ = s => document.querySelector(s);

// CSSセレクターに一致する全要素を配列として取得する短縮関数。
const $$ = s => Array.from(document.querySelectorAll(s));

// 未認証でも利用できるGoogleログイン開始・完了処理をPromiseとして呼び出す。
const publicRpc = (name, ...args) =>
  new Promise((resolve, reject) =>
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(e => {
        const message = e && e.message ? e.message : String(e);
        reject(new Error(message.replace(/^(?:Error|Exception):\s*/, '')));
      })[name](...args)
  );

// 画面から許可済みの業務RPCだけを共通ディスパッチャー経由で呼び出す。
const rpc = (name, ...args) => publicRpc('callClientApi', name, args);

// 画面へ埋め込む値をHTMLエスケープし、任意文字列の実行を防ぐ。
const esc = v => String(v ?? '').replace(/[&<>"']/g, m => ({
  '&': '&amp;',
  '<': '&lt;',
  '>': '&gt;',
  '"': '&quot;',
  "'": '&#39;'
}[m]));

// 数値を指定小数桁の日本語表示へ整形する。
const num = (v, d = 0) => Number(v || 0).toLocaleString('ja-JP', { minimumFractionDigits: d, maximumFractionDigits: d });

// 0～1の比率をパーセント表示へ変換する。
const pct = v => num(Number(v || 0) * 100, 0) + '%';

// ページごとの取得RPC、描画処理、月依存の有無を一元管理する。
// 新規ページ追加時はサーバー側buildBootstrapData_とこの定義の両方へ登録する。
const CLIENT_PAGES = Object.freeze({
  dashboard: { load: month => rpc('getDashboardView', month), render: renderDashboard },
  performance: { load: month => rpc('getPerformanceView', month), render: renderPerformance },
  skills: { load: () => rpc('getSkillView'), render: renderSkills, monthIndependent: true },
  assignments: { load: month => rpc('getAssignmentView', month), render: renderAssignments },
  errorsearch: { load: () => Promise.resolve({}), render: renderErrorAnalysis, monthIndependent: true },
  targets: { load: month => rpc('getTargetView', month), render: renderTargets },
  aggregate: { load: month => rpc('getAggregateView', month), render: renderAggregate },
  notifications: { load: () => rpc('getNotificationView'), render: renderNotifications, monthIndependent: true },
  settings: { load: month => rpc('getSettingsView', month), render: renderSettings },
  feedback: { load: () => rpc('getFeedbackView'), render: renderFeedback, monthIndependent: true }
});

/** 全画面ローダーの表示状態とメッセージを切り替える。 */
function busy(on, text = '処理中...') {
  $('#loaderText').textContent = text;
  $('#loader').classList.toggle('hidden', !on);
}

/** 成功・エラーメッセージを一定時間トースト表示する。 */
function toast(msg, error = false) {
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'toast show' + (error ? ' error' : '');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => el.className = 'toast', 3500);
}

/** Apps ScriptのURL情報からページIDと対象月を安全に取り出す。 */
function routeFromLocation(location) {
  const parameter = location && location.parameter ? location.parameter : {};
  return {
    page: String(parameter.page || 'dashboard'),
    month: /^\d{4}-\d{2}$/.test(String(parameter.month || '')) ? String(parameter.month) : '',
    explicit: Boolean(parameter.page || parameter.month)
  };
}

/** テンプレート埋込み値または現在URLから初期ルートを取得する。 */
function getInitialRoute() {
  if (state.initialRoute) return Promise.resolve(state.initialRoute);
  return new Promise(resolve => google.script.url.getLocation(location => {
    state.initialRoute = routeFromLocation(location);
    resolve(state.initialRoute);
  }));
}

/** 現在ページと対象月をブラウザ履歴・URLパラメータへ反映する。 */
function updateRoute(historyMode = 'push') {
  if (!state.boot || state.restoringHistory) return;
  const params = { page: state.page, month: $('#globalMonth').value || state.boot.currentMonth };
  const historyState = { page: params.page, month: params.month };
  if (historyMode === 'replace') google.script.history.replace(historyState, params, '');
  else if (historyMode === 'push') google.script.history.push(historyState, params, '');
}

/** 利用者情報と初期ページを取得し、ランディング画面からアプリ本体へ切り替える。 */
async function enterDashboard() {
  if (state.entering) return;
  let result = null;
  state.entering = true;
  busy(true, 'アプリを起動しています...');
  try {
    const route = await getInitialRoute();
    const initial = await rpc('getInitialView', route.page, route.month);
    state.boot = initial.boot;
    buildNav();
    state.page = initial.page;
    $('#globalMonth').value = initial.month;
    renderUser();
    $('#landing').classList.add('hidden');
    $('#app').classList.remove('hidden');
    preparePageChrome(state.page);
    state.lastServerView = {
      page: state.page,
      month: initial.month,
      data: initial.data,
      loadedAt: Date.now()
    };
    renderInitialPage(state.page, initial.data);
    updateRoute('replace');
    result = initial;
  } catch (e) {
    if (String(e.message || '').includes('閲覧権限がありません')) {
      await showGoogleIdentityLogin();
      toast('Googleアカウントで本人確認してください', true);
    } else {
      toast(e.message, true);
    }
    showLanding();
  } finally {
    state.entering = false;
    busy(false);
  }
  return result;
}

/** 共有端末に認証情報を残さないようセッションを削除し、Googleログイン画面へ戻す。 */
async function logoutIdentity() {
  busy(true, 'ログアウトしています...');
  try {
    await rpc('logoutGoogleIdentity');
    state.boot = null;
    state.cache = {};
    $('#app').classList.add('hidden');
    $('#landing').classList.remove('hidden');
    await showGoogleIdentityLogin();
    toast('ログアウトしました');
  } catch (error) {
    toast(error.message, true);
  } finally {
    busy(false);
  }
}

/** Googleログインの設定状態を確認し、ランディング画面へ本人確認ボタンを表示する。 */
async function showGoogleIdentityLogin() {
  const box = $('#googleIdentityLogin');
  const link = $('#googleIdentityLoginLink');
  try {
    const config = await publicRpc('getPublicIdentityConfig');
    state.identityConfigured = Boolean(config && config.configured);
    box.classList.remove('hidden');
    link.classList.add('disabled');
    link.setAttribute('aria-disabled', 'true');
    link.removeAttribute('href');
    box.querySelector('p').textContent = state.identityConfigured
      ? 'Googleログインを準備しています...'
      : 'Googleログイン設定が未完了です。管理者へ連絡してください。';
    if (!state.identityConfigured) return;

    // Apps Scriptのiframeは最上位画面の直接変更を拒否するため、
    // 遷移先を先に生成し、ユーザーがtarget="_top"リンクを押して移動できる状態にする。
    const route = await getInitialRoute();
    const monthInput = $('#globalMonth');
    const url = await publicRpc('createGoogleIdentitySignInUrl', {
      page: state.boot ? state.page : (route.page || 'dashboard'),
      month: (monthInput && monthInput.value) || route.month || ''
    });
    link.href = url;
    link.classList.remove('disabled');
    link.setAttribute('aria-disabled', 'false');
    box.querySelector('p').textContent = '登録済みのGoogleアカウントで本人確認してください。';
  } catch (error) {
    box.classList.remove('hidden');
    link.classList.add('disabled');
    link.setAttribute('aria-disabled', 'true');
    link.removeAttribute('href');
    box.querySelector('p').textContent = error.message;
  }
}

/** アプリ本体を隠し、ランディング画面へ戻す。 */
function showLanding() {
  document.body.classList.remove('direct-route');
  $('#app').classList.add('hidden');
  $('#landing').classList.remove('hidden');
}

/** 権限に応じたサイドバーナビゲーションを生成する。 */
function buildNav() {
  const allowed = state.boot.pages.filter(p => p.id !== 'feedback' && (!p.admin || state.boot.user.isAdmin));
  $('#nav').innerHTML = allowed.map(p => (
    `<button class="nav-item" data-page="${p.id}" onclick="openPage('${p.id}')">` +
      `<span class="nav-icon">${p.icon}</span>` +
      `${esc(p.label)}${p.admin ? '<span class="nav-lock">管理</span>' : ''}` +
    `</button>`
  )).join('');
  $$('.admin-only').forEach(el => el.classList.toggle('hidden', !state.boot.user.isAdmin));
}

/** ログインユーザー名、メール、管理者表示をサイドバーへ描画する。 */
function renderUser() {
  const u = state.boot.user;
  $('#userBadge').innerHTML = `<strong>${esc(u.name)}</strong>${esc(u.email)}${u.isAdmin ? ' · 管理者' : ''}`;
}

/** ページ権限を確認し、URLを更新して対象ページのデータ取得・描画を行う。 */
async function openPage(page, historyMode = 'push') {
  const allowed = state.boot.pages.some(p => p.id === page && (!p.admin || state.boot.user.isAdmin));
  if (!allowed) page = 'dashboard';
  state.page = page;
  updateRoute(historyMode);
  preparePageChrome(page);
  busy(true, 'データを読み込んでいます...');
  let data = null;
  try {
    data = await renderPage(page);
  } catch (e) {
    $('#content').innerHTML = `<div class="panel"><div class="empty">${esc(e.message)}</div></div>`;
    toast(e.message, true);
  } finally {
    busy(false);
  }
  return data;
}

/** 選択ナビ、ページ名、月入力欄などページ共通UIを切り替える。 */
function preparePageChrome(page) {
  $$('.nav-item').forEach(x => x.classList.toggle('active', x.dataset.page === page));
  $('#feedbackNav').classList.toggle('active', page === 'feedback');
  const meta = state.boot.pages.find(p => p.id === page);
  $('#pageTitle').textContent = meta ? meta.label : '';
  $('#pageEyebrow').textContent = page === 'dashboard' ? 'OVERVIEW' : page.toUpperCase();
  const definition = CLIENT_PAGES[page];
  $('#globalMonth').closest('label').classList.toggle('hidden', Boolean(definition && definition.monthIndependent));
}

/** 取得済みデータをページレジストリに対応する描画処理へ渡す。 */
function renderInitialPage(page, data) {
  const definition = CLIENT_PAGES[page] || CLIENT_PAGES.dashboard;
  return definition.render(data);
}

/** 現在ページを再取得し、必要な場合だけ新しい履歴としてURLへ追加する。 */
function reloadCurrentPage(pushHistory = false) {
  return openPage(state.page, pushHistory ? 'push' : 'none');
}

/** ページレジストリのRPCを実行し、取得結果を記録して描画する。 */
async function renderPage(page) {
  const month = $('#globalMonth').value;
  const definition = CLIENT_PAGES[page] || CLIENT_PAGES.dashboard;
  const data = await definition.load(month);
  state.lastServerView = {
    page: page,
    month: month,
    data: data,
    loadedAt: Date.now()
  };
  renderInitialPage(page, data);
  return data;
}

/** KPIカード1件分の共通HTMLを生成する。 */
function kpi(label, value, sub, cls = '') {
  return (
    `<div class="kpi ${cls}">` +
      `<div class="kpi-label">${label}</div>` +
      `<div class="kpi-value">${value}</div>` +
      `<div class="kpi-sub">${sub || ''}</div>` +
    `</div>`
  );
}

/** 月次KPI、四半期進捗、日次推移、チーム実績、期限超過を描画する。 */
function renderDashboard(d) {
  const k = d.kpis;
  const dailyMax = Math.max(1, ...d.daily.flatMap(x => [x.created, x.completed]));
  $('#content').innerHTML = (
    `<div class="kpi-grid">` +
      `${kpi('今月の総起票数', num(k.createdCount), 'Backlog作成日基準')}` +
      `${kpi('今月の完了件数', num(k.completedCount), '完了日基準')}` +
      `${kpi('期限超過チケット', num(k.overdueCount), '未完了・期限経過', 'danger-card')}` +
      `${kpi('目標達成率', pct(k.achievementRate), `${num(k.responsePoints, 1)} / ${num(k.targetCount, 1)} pt`)}` +
    `</div>` +
    `<div class="grid-2">` +
      `<section class="panel">` +
        `<div class="panel-head">` +
          `<div>` +
            `<div class="panel-title">日次推移</div>` +
            `<div class="panel-sub">起票数 / 完了数</div>` +
          `</div>` +
          `<span class="pill">最終同期 ${esc(d.lastSyncAt || '未同期')}</span>` +
        `</div>` +
        `<div class="panel-body">` +
          `<div class="spark">` +
            `${d.daily.map(x => (
              `<div class="spark-col" title="${x.date} 起票${x.created} 完了${x.completed}">` +
                `<div class="spark-bar created">` +
                `</div>` +
                `<div class="spark-bar completed" style="height:${x.completed / dailyMax * 100}%">` +
                `</div>` +
              `</div>`
            )).join('')}` +
          `</div>` +
        `</div>` +
      `</section>` +
      `<section class="panel">` +
        `<div class="panel-head">` +
          `<div>` +
            `<div class="panel-title">今季の進捗</div>` +
            `<div class="panel-sub">${esc(d.term.label)}</div>` +
          `</div>` +
        `</div>` +
        `<div class="panel-body">` +
          `<div class="kpi-value">${pct(d.term.achievementRate)}</div>` +
          `<div class="progress">` +
            `<span style="width:${Math.min(100, d.term.achievementRate * 100)}%">` +
            `</span>` +
          `</div>` +
          `<div class="stat-line">` +
            `<span>実績ポイント</span>` +
            `<strong>${num(d.term.points, 1)}</strong>` +
          `</div>` +
          `<div class="stat-line">` +
            `<span>目標ポイント</span>` +
            `<strong>${num(d.term.targetCount, 1)}</strong>` +
          `</div>` +
        `</div>` +
      `</section>` +
    `</div>` +
    `<div class="grid-2">` +
      `<section class="panel">` +
        `<div class="panel-head">` +
          `<div class="panel-title">チーム別達成状況</div>` +
        `</div>` +
        `<div class="panel-body">` +
          `${d.teamSummary.length ? d.teamSummary.map(x => (
            `<div class="progress-row">` +
              `<span>${esc(x.name)}</span>` +
              `<div class="progress">` +
                `<span style="width:${Math.min(100, x.achievementRate * 100)}%">` +
                `</span>` +
              `</div>` +
              `<strong>${pct(x.achievementRate)}</strong>` +
            `</div>`
          )).join('') : '<div class="empty">目標・実績データがありません</div>'}` +
        `</div>` +
      `</section>` +
      `<section class="panel">` +
        `<div class="panel-head">` +
          `<div class="panel-title">期限超過</div>` +
          `<span class="pill red">${d.overdueTickets.length}件表示</span>` +
        `</div>` +
        `<div class="table-wrap">` +
          `<table class="table">` +
            `<thead>` +
              `<tr>` +
                `<th>キー</th>` +
                `<th>件名</th>` +
                `<th>期限</th>` +
                `<th>担当</th>` +
              `</tr>` +
            `</thead>` +
            `<tbody>` +
              `${d.overdueTickets.map(x => (
                `<tr>` +
                  `<td>` +
                    `<a href="${esc(x.url)}" target="_blank">${esc(x.issueKey)}</a>` +
                  `</td>` +
                  `<td title="${esc(x.summary)}">${esc(x.summary).slice(0, 30)}</td>` +
                  `<td>${esc(x.dueDate)}</td>` +
                  `<td>${esc(x.owner || '-')}</td>` +
                `</tr>`
              )).join('')}` +
            `</tbody>` +
          `</table>` +
        `</div>` +
      `</section>` +
    `</div>`
  );
}

/** メンバー別実績一覧とチーム・氏名の絞り込みUIを描画する。 */
function renderPerformance(d) {
  $('#content').innerHTML = (
    `<div class="toolbar">` +
      `<div class="toolbar-left">` +
        `<select id="teamFilter" onchange="filterPerformance()">` +
          `<option value="">全チーム</option>` +
          `${d.teams.map(t => `<option>${esc(t)}</option>`).join('')}` +
        `</select>` +
        `<input id="memberSearch" placeholder="メンバー検索" oninput="filterPerformance()">` +
      `</div>` +
      `<span class="pill">${d.memberCount == null ? d.rows.length : d.memberCount}名</span>` +
    `</div>` +
    `<section class="panel">` +
      `<div class="table-wrap">` +
        `<table class="table" id="performanceTable">` +
          `<thead>` +
            `<tr>` +
              `<th>メンバー</th>` +
              `<th>チーム</th>` +
              `<th>完了</th>` +
              `<th>ポイント</th>` +
              `<th>目標</th>` +
              `<th>達成率</th>` +
              `<th>品質</th>` +
              `<th>TAT ≤2日</th>` +
              `<th>≤5日</th>` +
              `<th>6日+</th>` +
            `</tr>` +
          `</thead>` +
          `<tbody>` +
            `${d.rows.map(r => (
              `<tr data-team="${esc(r.team)}" data-name="${esc(r.name)}" class="performance-member-row">` +
                `<td>` +
                  `<button class="secondary" style="padding:4px 8px;margin-right:8px" onclick="togglePerformanceDetails(this, event)" aria-label="チケット明細を表示">▸</button>` +
                  `<strong>${esc(r.name)}</strong>` +
                `</td>` +
                `<td>${esc(r.team || '-')}</td>` +
                `<td>${num(r.completedCount)}</td>` +
                `<td>${num(r.points, 1)}</td>` +
                `<td>${num(r.targetCount, 1)}</td>` +
                `<td>` +
                  `<span class="pill ${r.achievementRate >= 1 ? 'green' : r.achievementRate >= .8 ? 'amber' : 'red'}">` +
                    `${pct(r.achievementRate)}` +
                  `</span>` +
                `</td>` +
                `<td>${r.qualityAverage == null ? '-' : num(r.qualityAverage, 2)}</td>` +
                `<td>${num(r.tat2)}</td>` +
                `<td>${num(r.tat5)}</td>` +
                `<td>${num(r.tat6)}</td>` +
              `</tr>` +
              `<tr class="performance-detail-row hidden" data-team="${esc(r.team)}" data-name="${esc(r.name)}">` +
                `<td colspan="10"><div class="performance-detail-content"></div></td>` +
              `</tr>`
            )).join('')}` +
          `</tbody>` +
        `</table>` +
      `</div>` +
    `</section>`
  );
  refreshPerformanceZebra();
}

/** チームとメンバー名で実績行を絞り込み、明細行と縞模様も同期する。 */
function filterPerformance() {
  const team = $('#teamFilter').value,
    q = $('#memberSearch').value.toLowerCase();
  $$('#performanceTable tbody .performance-member-row').forEach(tr => {
    const hidden = (team && tr.dataset.team !== team) || (q && !tr.dataset.name.toLowerCase().includes(q));
    tr.classList.toggle('hidden', hidden);
    const detailRow = tr.nextElementSibling;
    detailRow.classList.toggle('hidden', hidden || detailRow.dataset.open !== 'true');
  });
  refreshPerformanceZebra();
}

/** 表示中のメンバーだけを数え直し、親行と明細行へ交互色を適用する。 */
function refreshPerformanceZebra() {
  let visibleIndex = 0;
  $$('#performanceTable tbody .performance-member-row').forEach(memberRow => {
    const detailRow = memberRow.nextElementSibling;
    const visible = !memberRow.classList.contains('hidden');
    const zebraClass = visibleIndex % 2 === 0 ? 'zebra-base' : 'zebra-alt';
    [memberRow, detailRow].forEach(row => {
      row.classList.remove('zebra-base', 'zebra-alt');
      row.classList.add(zebraClass);
    });
    if (visible) visibleIndex++;
  });
}

/** メンバー行の開閉状態を切り替え、初回だけチケット明細を取得して描画する。 */
async function togglePerformanceDetails(button, event) {
  event.stopPropagation();
  const memberRow = button.closest('tr');
  const detailRow = memberRow.nextElementSibling;
  const content = detailRow.querySelector('.performance-detail-content');
  const opening = detailRow.dataset.open !== 'true';
  detailRow.dataset.open = opening ? 'true' : 'false';
  detailRow.classList.toggle('hidden', !opening);
  button.textContent = opening ? '▾' : '▸';
  if (!opening || detailRow.dataset.loaded === 'true') return;
  content.innerHTML = '<div class="empty">チケットを読み込んでいます...</div>';
  try {
    const data = await rpc('getPerformanceMemberIssues', $('#globalMonth').value, memberRow.dataset.name);
    const issues = data && Array.isArray(data.rows) ? data.rows : [];
    detailRow.dataset.loaded = 'true';
    content.innerHTML = issues.length ? (
      `<div class="table-wrap"><table class="table">` +
        `<thead><tr><th>件名</th><th>マイルストーン</th><th>緊急</th><th>評価ポイント</th><th>対応日数（TAT）</th></tr></thead>` +
        `<tbody>` +
        issues.map(issue => (
          `<tr>` +
            `<td><a href="${esc(issue.url)}" target="_blank" rel="noopener">${esc(issue.summary || issue.issueKey)}</a></td>` +
            `<td>${esc(issue.milestone || '-')}</td>` +
            `<td>${String(issue.emergencyFlag) === 'true' || issue.emergencyFlag === true ? '<span class="pill red">緊急</span>' : '-'}</td>` +
            `<td>${num(issue.point, 2)}</td>` +
            `<td>${issue.tatBusinessDays === '' ? '-' : num(issue.tatBusinessDays, 0)}</td>` +
          `</tr>`
        )).join('') +
        `</tbody>` +
      `</table></div>`
    ) : '<div class="empty">対象チケットはありません</div>';
  } catch (e) {
    content.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
    toast(e.message, true);
  }
}

/** メンバー選択、スキルカード、合計ポイント、管理者用追加フォームを描画する。 */
function renderSkills(d) {
  state.cache.skills = d;
  if (!state.skillMemberId)

/** スキル定義と現在スコアから1枚のスキル入力カードHTMLを生成する。 */
function skillCard(s, score) {
  const lv = Number(score?.level || 0);
  return (
    `<article class="skill-card">` +
      `<span class="pill">${esc(s.category)}</span>` +
      `<h4>${esc(s.skillName)}</h4>` +
      `<p>${esc(s.description || '')}</p>` +
      `<div class="level-row">` +
        `${Array.from({ length: Number(s.maxLevel || 5) }, (_, i) => `<button class="level-dot ${i < lv ? 'active' : ''}" onclick="saveSkill('${esc(s.skillId)}',${i + 1})">${i + 1}</button>`).join('')}` +
      `</div>` +
      `<div class="score">${num(lv * Number(s.pointsPerLevel || 1))} pt</div>` +
    `</article>`
  );
}

/** 画面上の全スキルレベルから現在の合計ポイントを再計算する。 */
function updateSkillTotal() {
  const d = state.cache.skills;
  const total = d.scores.filter(x => x.memberId === state.skillMemberId).reduce((a, x) => a + Number(x.points || 0), 0);

  const select = $('#aMember');

  const row = state.cache.assignments.rows.find(r => String(r.memberId) === String(select.value));
  if (!row) return;
  $('#aResponse').value = Number(row.responseHours || 0);
  $('#aImprovement').value = Number(row.improvementHours || 0);
  $('#aSpecial').value = Number(row.specialHours || 0);
}

/** アサイン行を合計し、予定・実績・残時間のサマリーを生成する。 */
function assignmentSummary(rows) {
  const total = rows.reduce((a, r) => a + Number(r.actualHours || 0), 0);
  const planned = rows.reduce((a, r) => a + Number(r.plannedHours || 0), 0);
  const members = new Set(rows.map(r => r.memberId)).size;
  return (
    `<div class="kpi-value">${num(total, 1)} h</div>` +
    `<div class="stat-line">` +
      `<span>入力メンバー</span>` +
      `<strong>${members}名</strong>` +
    `</div>` +
    `<div class="stat-line">` +
      `<span>予定合計</span>` +
      `<strong>${num(planned, 1)} h</strong>` +
    `</div>`
  );
}

/** 指定日が属する週の月曜日をyyyy-MM-dd形式で返す。 */
function getMondayKey(d) {
  const x = new Date(d),
    day = x.getDay();
  x.setDate(x.getDate() - (day === 0 ? 6 : day - 1));
  return x.toISOString().slice(0, 10);
}

/** 設定画面の環境値をScript Propertiesへ保存する。 */
async function saveSettings() {
  const input = {
    adminGroupEmail: $('#sAdminGroup').value,
    adminEmails: $('#sAdmins').value,
    googleIdentityClientId: $('#sIdentityClientId').value,
    googleIdentityClientSecret: $('#sIdentityClientSecret').value,
    backlogSpaceUrl: $('#sSpace').value,
    backlogProjectKeys: $('#sProjects').value,
    backlogApiKey: $('#sApiKey').value,
    slackWebhookUrl: $('#sSlack').value,
    termStartDate: $('#sTerm').value
  };
  busy(true, '設定を保存しています...');
  try {
    await rpc('saveAppSettings', input);
    const identityEnabled = Boolean(input.googleIdentityClientId &&
      (input.googleIdentityClientSecret || state.cache.settings.googleIdentityClientSecretConfigured));
    if (identityEnabled) {
      showLanding();
      await showGoogleIdentityLogin();
      toast('設定を保存しました。Googleアカウントでログインしてください');
      return;
    }
    toast('設定を保存しました');
    await reloadCurrentPage();
  } catch (e) {
    toast(e.message, true);
  } finally {
    busy(false);
  }
}

/** 対象メンバーの固定Google ID連携を解除し、次回ログインで再連携させる。 */
async function resetGoogleIdentity(memberId) {
  if (!window.confirm('このメンバーのGoogle認証連携を再設定しますか？')) return;
  busy(true, 'Google認証連携を解除しています...');
  try {
    await rpc('resetMemberGoogleIdentity', memberId);
    toast('Google認証連携を解除しました');
    await reloadCurrentPage();
  } catch (error) {
    toast(error.message, true);
  } finally {
    busy(false);
  }
}

/** 画面上のメンバー行を収集し、対象月の所属とマスタ設定を保存する。 */
async function saveMemberSettings() {
  const source = state.cache.settings.members;
  const rows = $$('#memberSettings tbody tr').map(tr => {
    const old = source.find(m => m.memberId === tr.dataset.id);
    return {
      ...old,
      email: tr.querySelector('.m-email').value,
      team: tr.querySelector('.m-team').value,
      role: tr.querySelector('.m-role').value,
      active: true
    };
  });
  busy(true, 'メンバー設定を保存しています...');
  try {
    await rpc('saveMonthlyMemberSettings', { month: $('#globalMonth').value, rows });
    toast($('#globalMonth').value + ' の所属チームとメンバー設定を保存しました');
    await reloadCurrentPage();
  } catch (e) {
    toast(e.message, true);
  } finally {
    busy(false);
  }
}

/** Backlog同期を開始し、完了後に実績キャッシュの差分再集計を実行する。 */
async function manualSync() {
  busy(true, 'Backlogを同期しています...');
  try {
    const r = await rpc('manualBacklogSync');
    if (!r || r.ok === false) throw new Error(r && r.message ? r.message : 'Backlog同期を開始できませんでした。');
    if (r.continued) {
      toast('Backlog同期を継続実行します');
    } else {
      busy(true, 'Backlog同期完了。実績を再集計しています...');
      const cache = await rpc('rebuildAnalyticsCacheAfterBacklogSync');
      if (!cache || cache.ok === false) throw new Error(cache && cache.message ? cache.message : '実績の再集計を開始できませんでした。');
      toast(cache.continued ? '同期完了。実績の再集計を継続します' : '同期・実績再集計が完了しました');
    }
    await reloadCurrentPage();
  } catch (e) {
    toast(e.message, true);
  } finally {
    busy(false);
  }
}

/** 戻る・進む操作のURLと履歴状態からページ・対象月を復元する。 */
async function restoreRoute(location, historyState) {
  if (!state.boot) return;
  const route = routeFromLocation(location);
  const requestedPage = String((historyState && historyState.page) || route.page || 'dashboard');
  const requestedMonth = String((historyState && historyState.month) || route.month || state.boot.currentMonth);
  state.restoringHistory = true;
  try {
    $('#globalMonth').value = /^\d{4}-\d{2}$/.test(requestedMonth) ? requestedMonth : state.boot.currentMonth;
    await openPage(requestedPage, 'none');
  } finally {
    state.restoringHistory = false;
  }
}

/** URL変更ハンドラーを登録し、直接リンクの場合は自動でアプリを起動する。 */
function initializeRouting() {
  google.script.history.setChangeHandler(event => {
    restoreRoute(event.location, event.state).catch(error => toast(error.message, true));
  });
  getInitialRoute().then(route => {
    if (route.explicit) enterDashboard();
  }).catch(error => toast(error.message, true));
}

initializeRouting();
