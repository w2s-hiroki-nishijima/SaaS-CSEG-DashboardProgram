<script>
const state = {
  boot: null,
  page: 'dashboard',
  cache: {},
  skillMemberId: ''
};

const $ = s => document.querySelector(s);

const $$ = s => Array.from(document.querySelectorAll(s));

const rpc = (name, ...args) =>
  new Promise((resolve, reject) =>
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(e =>
        reject(new Error(e && e.message ? e.message : String(e)))
      )[name](...args)
  );

const esc = v => String(v ?? '').replace(/[&<>"']/g, m => ({
  '&': '&amp;',
  '<': '&lt;',
  '>': '&gt;',
  '"': '&quot;',
  "'": '&#39;'
}[m]));

const num = (v, d = 0) => Number(v || 0).toLocaleString('ja-JP', { minimumFractionDigits: d, maximumFractionDigits: d });

const pct = v => num(Number(v || 0) * 100, 0) + '%';

function busy(on, text = '処理中...') {
  $('#loaderText').textContent = text;
  $('#loader').classList.toggle('hidden', !on);
}

function toast(msg, error = false) {
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'toast show' + (error ? ' error' : '');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => el.className = 'toast', 3500);
}

async function enterDashboard() {
  busy(true, 'アプリを起動しています...');
  try {
    const initial = await rpc('getInitialView');
    state.boot = initial.boot;
    state.page = 'dashboard';
    $('#globalMonth').value = state.boot.currentMonth;
    buildNav();
    renderUser();
    $('#landing').classList.add('hidden');
    $('#app').classList.remove('hidden');
    $$('.nav-item').forEach(x => x.classList.toggle('active', x.dataset.page === 'dashboard'));
    $('#pageTitle').textContent = 'ダッシュボード';
    $('#pageEyebrow').textContent = 'OVERVIEW';
    $('#globalMonth').closest('label').classList.remove('hidden');
    renderDashboard(initial.dashboard);
  } catch (e) {
    toast(e.message, true);
  } finally {
    busy(false);
  }
}

function showLanding() {
  $('#app').classList.add('hidden');
  $('#landing').classList.remove('hidden');
}

function buildNav() {
  const allowed = state.boot.pages.filter(p => !p.admin || state.boot.user.isAdmin);
  $('#nav').innerHTML = allowed.map(p => (
    `<button class="nav-item" data-page="${p.id}" onclick="openPage('${p.id}')">` +
      `<span class="nav-icon">${p.icon}</span>` +
      `${esc(p.label)}${p.admin ? '<span class="nav-lock">管理</span>' : ''}` +
    `</button>`
  )).join('');
  $$('.admin-only').forEach(el => el.classList.toggle('hidden', !state.boot.user.isAdmin));
}

function renderUser() {
  const u = state.boot.user;
  $('#userBadge').innerHTML = `<strong>${esc(u.name)}</strong>${esc(u.email)}${u.isAdmin ? ' · 管理者' : ''}`;
}

async function openPage(page) {
  state.page = page;
  $$('.nav-item').forEach(x => x.classList.toggle('active', x.dataset.page === page));
  const meta = state.boot.pages.find(p => p.id === page);
  $('#pageTitle').textContent = meta ? meta.label : '';
  $('#pageEyebrow').textContent = page === 'dashboard' ? 'OVERVIEW' : page.toUpperCase();
  $('#globalMonth').closest('label').classList.toggle('hidden', ['skills', 'notifications'].includes(page));
  busy(true, 'データを読み込んでいます...');
  try {
    await renderPage(page);
  } catch (e) {
    $('#content').innerHTML = `<div class="panel"><div class="empty">${esc(e.message)}</div></div>`;
    toast(e.message, true);
  } finally {
    busy(false);
  }
}

function reloadCurrentPage() {
  openPage(state.page);
}

async function renderPage(page) {
  const month = $('#globalMonth').value;
  if (page === 'dashboard')
    return renderDashboard(await rpc('getDashboardView', month));
  if (page === 'performance')
    return renderPerformance(await rpc('getPerformanceView', month));
  if (page === 'skills')
    return renderSkills(await rpc('getSkillView'));
  if (page === 'assignments')
    return renderAssignments(await rpc('getAssignmentView', month));
  if (page === 'targets')
    return renderTargets(await rpc('getTargetView', month));
  if (page === 'aggregate')
    return renderAggregate(await rpc('getAggregateView', month));
  if (page === 'notifications')
    return renderNotifications(await rpc('getNotificationView'));
  if (page === 'settings')
    return renderSettings(await rpc('getSettingsView', month));
}

function kpi(label, value, sub, cls = '') {
  return (
    `<div class="kpi ${cls}">` +
      `<div class="kpi-label">${label}</div>` +
      `<div class="kpi-value">${value}</div>` +
      `<div class="kpi-sub">${sub || ''}</div>` +
    `</div>`
  );
}

function renderDashboard(d) {
  const k = d.kpis;
  const dailyMax = Math.max(1, ...d.daily.flatMap(x => [x.created, x.completed]));
  $('#content').innerHTML = (
    `<div class="kpi-grid">` +
      `${kpi('今月の総起票数', num(k.createdCount), 'Backlog作成日基準')}` +
      `${kpi('今月の完了件数', num(k.completedCount), '完了日基準')}` +
      `${kpi('期限超過チケット', num(k.overdueCount), '未完了・期限経過', 'danger-card')}` +
      `${kpi('目標達成率', pct(k.achievementRate), `${num(k.responsePoints, 1)} / ${num(k.targetCount, 1)} pt`)}` +
    `</div>` +
    `<div class="grid-2">` +
      `<section class="panel">` +
        `<div class="panel-head">` +
          `<div>` +
            `<div class="panel-title">日次推移</div>` +
            `<div class="panel-sub">起票数 / 完了数</div>` +
          `</div>` +
          `<span class="pill">最終同期 ${esc(d.lastSyncAt || '未同期')}</span>` +
        `</div>` +
        `<div class="panel-body">` +
          `<div class="spark">` +
            `${d.daily.map(x => (
              `<div class="spark-col" title="${x.date} 起票${x.created} 完了${x.completed}">` +
                `<div class="spark-bar created" style="height:${x.created / dailyMax * 100}%">` +
                `</div>` +
                `<div class="spark-bar completed" style="height:${x.completed / dailyMax * 100}%">` +
                `</div>` +
              `</div>`
            )).join('')}` +
          `</div>` +
        `</div>` +
      `</section>` +
      `<section class="panel">` +
        `<div class="panel-head">` +
          `<div>` +
            `<div class="panel-title">今季の進捗</div>` +
            `<div class="panel-sub">${esc(d.term.label)}</div>` +
          `</div>` +
        `</div>` +
        `<div class="panel-body">` +
          `<div class="kpi-value">${pct(d.term.achievementRate)}</div>` +
          `<div class="progress">` +
            `<span style="width:${Math.min(100, d.term.achievementRate * 100)}%">` +
            `</span>` +
          `</div>` +
          `<div class="stat-line">` +
            `<span>実績ポイント</span>` +
            `<strong>${num(d.term.points, 1)}</strong>` +
          `</div>` +
          `<div class="stat-line">` +
            `<span>目標ポイント</span>` +
            `<strong>${num(d.term.targetCount, 1)}</strong>` +
          `</div>` +
        `</div>` +
      `</section>` +
    `</div>` +
    `<div class="grid-2">` +
      `<section class="panel">` +
        `<div class="panel-head">` +
          `<div class="panel-title">チーム別達成状況</div>` +
        `</div>` +
        `<div class="panel-body">` +
          `${d.teamSummary.length ? d.teamSummary.map(x => (
            `<div class="progress-row">` +
              `<span>${esc(x.name)}</span>` +
              `<div class="progress">` +
                `<span style="width:${Math.min(100, x.achievementRate * 100)}%">` +
                `</span>` +
              `</div>` +
              `<strong>${pct(x.achievementRate)}</strong>` +
            `</div>`
          )).join('') : '<div class="empty">目標・実績データがありません</div>'}` +
        `</div>` +
      `</section>` +
      `<section class="panel">` +
        `<div class="panel-head">` +
          `<div class="panel-title">期限超過</div>` +
          `<span class="pill red">${d.overdueTickets.length}件表示</span>` +
        `</div>` +
        `<div class="table-wrap">` +
          `<table class="table">` +
            `<thead>` +
              `<tr>` +
                `<th>キー</th>` +
                `<th>件名</th>` +
                `<th>期限</th>` +
                `<th>担当</th>` +
              `</tr>` +
            `</thead>` +
            `<tbody>` +
              `${d.overdueTickets.map(x => (
                `<tr>` +
                  `<td>` +
                    `<a href="${esc(x.url)}" target="_blank">${esc(x.issueKey)}</a>` +
                  `</td>` +
                  `<td title="${esc(x.summary)}">${esc(x.summary).slice(0, 30)}</td>` +
                  `<td>${esc(x.dueDate)}</td>` +
                  `<td>${esc(x.owner || '-')}</td>` +
                `</tr>`
              )).join('')}` +
            `</tbody>` +
          `</table>` +
        `</div>` +
      `</section>` +
    `</div>`
  );
}

function renderPerformance(d) {
  $('#content').innerHTML = (
    `<div class="toolbar">` +
      `<div class="toolbar-left">` +
        `<select id="teamFilter" onchange="filterPerformance()">` +
          `<option value="">全チーム</option>` +
          `${d.teams.map(t => `<option>${esc(t)}</option>`).join('')}` +
        `</select>` +
        `<input id="memberSearch" placeholder="メンバー検索" oninput="filterPerformance()">` +
      `</div>` +
      `<span class="pill">${d.memberCount == null ? d.rows.length : d.memberCount}名</span>` +
    `</div>` +
    `<section class="panel">` +
      `<div class="table-wrap">` +
        `<table class="table" id="performanceTable">` +
          `<thead>` +
            `<tr>` +
              `<th>メンバー</th>` +
              `<th>チーム</th>` +
              `<th>完了</th>` +
              `<th>ポイント</th>` +
              `<th>目標</th>` +
              `<th>達成率</th>` +
              `<th>品質</th>` +
              `<th>TAT ≤2日</th>` +
              `<th>≤5日</th>` +
              `<th>6日+</th>` +
            `</tr>` +
          `</thead>` +
          `<tbody>` +
            `${d.rows.map(r => (
              `<tr data-team="${esc(r.team)}" data-name="${esc(r.name)}" class="performance-member-row">` +
                `<td>` +
                  `<button class="secondary" style="padding:4px 8px;margin-right:8px" onclick="togglePerformanceDetails(this, event)" aria-label="チケット明細を表示">▸</button>` +
                  `<strong>${esc(r.name)}</strong>` +
                `</td>` +
                `<td>${esc(r.team || '-')}</td>` +
                `<td>${num(r.completedCount)}</td>` +
                `<td>${num(r.points, 1)}</td>` +
                `<td>${num(r.targetCount, 1)}</td>` +
                `<td>` +
                  `<span class="pill ${r.achievementRate >= 1 ? 'green' : r.achievementRate >= .8 ? 'amber' : 'red'}">` +
                    `${pct(r.achievementRate)}` +
                  `</span>` +
                `</td>` +
                `<td>${r.qualityAverage == null ? '-' : num(r.qualityAverage, 2)}</td>` +
                `<td>${num(r.tat2)}</td>` +
                `<td>${num(r.tat5)}</td>` +
                `<td>${num(r.tat6)}</td>` +
              `</tr>` +
              `<tr class="performance-detail-row hidden" data-team="${esc(r.team)}" data-name="${esc(r.name)}">` +
                `<td colspan="10"><div class="performance-detail-content"></div></td>` +
              `</tr>`
            )).join('')}` +
          `</tbody>` +
        `</table>` +
      `</div>` +
    `</section>`
  );
}

function filterPerformance() {
  const team = $('#teamFilter').value,
    q = $('#memberSearch').value.toLowerCase();
  $$('#performanceTable tbody .performance-member-row').forEach(tr => {
    const hidden = (team && tr.dataset.team !== team) || (q && !tr.dataset.name.toLowerCase().includes(q));
    tr.classList.toggle('hidden', hidden);
    const detailRow = tr.nextElementSibling;
    detailRow.classList.toggle('hidden', hidden || detailRow.dataset.open !== 'true');
  });
}

async function togglePerformanceDetails(button, event) {
  event.stopPropagation();
  const memberRow = button.closest('tr');
  const detailRow = memberRow.nextElementSibling;
  const content = detailRow.querySelector('.performance-detail-content');
  const opening = detailRow.dataset.open !== 'true';
  detailRow.dataset.open = opening ? 'true' : 'false';
  detailRow.classList.toggle('hidden', !opening);
  button.textContent = opening ? '▾' : '▸';
  if (!opening || detailRow.dataset.loaded === 'true') return;
  content.innerHTML = '<div class="empty">チケットを読み込んでいます...</div>';
  try {
    const data = await rpc('getPerformanceMemberIssues', $('#globalMonth').value, memberRow.dataset.name);
    detailRow.dataset.loaded = 'true';
    content.innerHTML = data.rows.length ? (
      `<div class="table-wrap"><table class="table">` +
        `<thead><tr><th>件名</th><th>マイルストーン</th><th>緊急</th><th>評価ポイント</th><th>対応日数（TAT）</th></tr></thead>` +
        `<tbody>` +
        data.rows.map(issue => (
          `<tr>` +
            `<td><a href="${esc(issue.url)}" target="_blank" rel="noopener">${esc(issue.summary || issue.issueKey)}</a></td>` +
            `<td>${esc(issue.milestone || '-')}</td>` +
            `<td>${String(issue.emergencyFlag) === 'true' || issue.emergencyFlag === true ? '<span class="pill red">緊急</span>' : '-'}</td>` +
            `<td>${num(issue.point, 2)}</td>` +
            `<td>${issue.tatBusinessDays === '' ? '-' : num(issue.tatBusinessDays, 0)}</td>` +
          `</tr>`
        )).join('') +
        `</tbody>` +
      `</table></div>`
    ) : '<div class="empty">対象チケットはありません</div>';
  } catch (e) {
    content.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
    toast(e.message, true);
  }
}

function renderSkills(d) {
  state.cache.skills = d;
  if (!state.skillMemberId)
    state.skillMemberId = d.user.memberId || d.members[0]?.memberId || '';
  const options = d.members.map(m => `<option value="${esc(m.memberId)}" ${m.memberId === state.skillMemberId ? 'selected' : ''}>${esc(m.name)} / ${esc(m.team)}</option>`).join('');
  const adminForm = d.user.isAdmin ? (
    `<section class="panel" style="margin-top:18px">` +
      `<div class="panel-head">` +
        `<div>` +
          `<div class="panel-title">スキル項目を追加</div>` +
          `<div class="panel-sub">参考シートの固定構造ではなく、自由に項目を追加できます</div>` +
        `</div>` +
      `</div>` +
      `<div class="panel-body">` +
        `<div class="form-grid">` +
          `<div class="field">` +
            `<label>カテゴリ</label>` +
            `<input id="skCategory" value="共通">` +
          `</div>` +
          `<div class="field">` +
            `<label>スキル名</label>` +
            `<input id="skName">` +
          `</div>` +
          `<div class="field full">` +
            `<label>説明</label>` +
            `<input id="skDescription">` +
          `</div>` +
          `<div class="field">` +
            `<label>最大レベル</label>` +
            `<input id="skMax" type="number" min="1" max="10" value="5">` +
          `</div>` +
          `<div class="field">` +
            `<label>レベルごとのポイント</label>` +
            `<input id="skPoint" type="number" min="0" value="10">` +
          `</div>` +
        `</div>` +
        `<div class="actions">` +
          `<button class="primary" onclick="addSkillMaster()">項目を追加</button>` +
        `</div>` +
      `</div>` +
    `</section>`
  ) : '';
  $('#content').innerHTML = (
    `<div class="toolbar">` +
      `<div class="toolbar-left">` +
        `<select onchange="state.skillMemberId=this.value;renderSkills(state.cache.skills)">${options}</select>` +
      `</div>` +
      `<div class="score" id="totalSkillScore">` +
      `</div>` +
    `</div>` +
    `<div class="skill-grid">` +
      `${d.skills.map(s => skillCard(s, d.scores.find(x => x.memberId === state.skillMemberId && x.skillId === s.skillId))).join('')}` +
    `</div>` +
    `${adminForm}`
  );
  updateSkillTotal();
}

function skillCard(s, score) {
  const lv = Number(score?.level || 0);
  return (
    `<article class="skill-card">` +
      `<span class="pill">${esc(s.category)}</span>` +
      `<h4>${esc(s.skillName)}</h4>` +
      `<p>${esc(s.description || '')}</p>` +
      `<div class="level-row">` +
        `${Array.from({ length: Number(s.maxLevel || 5) }, (_, i) => `<button class="level-dot ${i < lv ? 'active' : ''}" onclick="saveSkill('${esc(s.skillId)}',${i + 1})">${i + 1}</button>`).join('')}` +
      `</div>` +
      `<div class="score">${num(lv * Number(s.pointsPerLevel || 1))} pt</div>` +
    `</article>`
  );
}

function updateSkillTotal() {
  const d = state.cache.skills;
  const total = d.scores.filter(x => x.memberId === state.skillMemberId).reduce((a, x) => a + Number(x.points || 0), 0);
  $('#totalSkillScore').textContent = `合計 ${num(total)} pt`;
}

async function saveSkill(skillId, level) {
  busy(true, 'スキルを保存しています...');
  try {
    await rpc('saveSkillScore', {
      memberId: state.skillMemberId,
      skillId,
      level
    });
    state.cache.skills = await rpc('getSkillView');
    renderSkills(state.cache.skills);
    toast('スキルポイントを保存しました');
  } catch (e) {
    toast(e.message, true);
  } finally {
    busy(false);
  }
}

async function addSkillMaster() {
  const input = {
    category: $('#skCategory').value,
    skillName: $('#skName').value,
    description: $('#skDescription').value,
    maxLevel: $('#skMax').value,
    pointsPerLevel: $('#skPoint').value,
    active: true,
    displayOrder: state.cache.skills.skills.length * 10 + 10
  };
  busy(true, 'スキル項目を追加しています...');
  try {
    await rpc('saveSkillMaster', input);
    toast('スキル項目を追加しました');
    state.cache.skills = await rpc('getSkillView');
    renderSkills(state.cache.skills);
  } catch (e) {
    toast(e.message, true);
  } finally {
    busy(false);
  }
}

function renderAssignments(d) {
  state.cache.assignments = d;
  const own = d.user.memberId;
  const options = d.members.map(m => `<option value="${esc(m.memberId)}" ${m.memberId === own ? 'selected' : ''}>${esc(m.name)} / ${esc(m.team)}</option>`).join('');
  $('#content').innerHTML = (
    `<div class="grid-2">` +
      `<section class="panel">` +
        `<div class="panel-head">` +
          `<div>` +
            `<div class="panel-title">週次実績を入力</div>` +
            `<div class="panel-sub">対応・改善・特殊対応を週単位で記録</div>` +
          `</div>` +
        `</div>` +
        `<div class="panel-body">` +
          `<div class="form-grid">` +
            `<div class="field">` +
              `<label>メンバー</label>` +
              `<select id="aMember">${options}</select>` +
            `</div>` +
            `<div class="field">` +
              `<label>週開始日</label>` +
              `<input id="aWeek" type="date">` +
            `</div>` +
            `<div class="field">` +
              `<label>対応実績（h）</label>` +
              `<input id="aResponse" type="number" min="0" step="0.5" value="0">` +
            `</div>` +
            `<div class="field">` +
              `<label>改善実績（h）</label>` +
              `<input id="aImprovement" type="number" min="0" step="0.5" value="0">` +
            `</div>` +
            `<div class="field">` +
              `<label>特殊対応実績（h）</label>` +
              `<input id="aSpecial" type="number" min="0" step="0.5" value="0">` +
            `</div>` +
            `<div class="field">` +
              `<label>予定時間（h）</label>` +
              `<input id="aPlanned" type="number" min="0" step="0.5" value="0">` +
            `</div>` +
            `<div class="field full">` +
              `<label>メモ</label>` +
              `<textarea id="aNote" rows="3">` +
              `</textarea>` +
            `</div>` +
          `</div>` +
          `<div class="actions">` +
            `<button class="primary" onclick="saveAssignment()">保存</button>` +
          `</div>` +
        `</div>` +
      `</section>` +
      `<section class="panel">` +
        `<div class="panel-head">` +
          `<div class="panel-title">今月の入力状況</div>` +
        `</div>` +
        `<div class="panel-body">${assignmentSummary(d.rows)}</div>` +
      `</section>` +
    `</div>` +
    `<section class="panel" style="margin-top:18px">` +
      `<div class="table-wrap">` +
        `<table class="table">` +
          `<thead>` +
            `<tr>` +
              `<th>週</th>` +
              `<th>メンバー</th>` +
              `<th>チーム</th>` +
              `<th>対応</th>` +
              `<th>改善</th>` +
              `<th>特殊</th>` +
              `<th>予定</th>` +
              `<th>更新者</th>` +
            `</tr>` +
          `</thead>` +
          `<tbody>` +
            `${d.rows.map(r => (
              `<tr>` +
                `<td>${esc(r.weekStart)}</td>` +
                `<td>${esc(r.memberName)}</td>` +
                `<td>${esc(r.team)}</td>` +
                `<td>${num(r.responseHours, 1)}</td>` +
                `<td>${num(r.improvementHours, 1)}</td>` +
                `<td>${num(r.specialHours, 1)}</td>` +
                `<td>${num(r.plannedHours, 1)}</td>` +
                `<td>${esc(r.updatedBy)}</td>` +
              `</tr>`
            )).join('')}` +
          `</tbody>` +
        `</table>` +
      `</div>` +
    `</section>`
  );
  $('#aWeek').value = getMondayKey(new Date());
}

function assignmentSummary(rows) {
  const total = rows.reduce((a, r) => a + Number(r.responseHours || 0) + Number(r.improvementHours || 0) + Number(r.specialHours || 0), 0);
  const members = new Set(rows.map(r => r.memberId)).size;
  return (

}

function getMondayKey(d) {
  const x = new Date(d),
    day = x.getDay();
  x.setDate(x.getDate() - (day === 0 ? 6 : day - 1));
  return x.toISOString().slice(0, 10);
}

function recalcTarget(input) {
  const tr = input.closest('tr'),
    speed = Number(tr.querySelector('.t-result').dataset.speed),
    a = Number(tr.querySelector('.t-assignment').value || 0),
    m = Number(tr.querySelector('.t-minus').value || 0),
    x = Number(tr.querySelector('.t-adjust').value || 0);
  tr.querySelector('.t-result strong').textContent = num(Math.max(0, speed * (a - m - x) / 5.5), 1);
}

async function manualSync() {
  busy(true, 'Backlogを同期しています...');
  try {
    const r = await rpc('manualBacklogSync');
    if (!r || r.ok === false) throw new Error(r && r.message ? r.message : 'Backlog同期を開始できませんでした。');
    if (r.continued) {
      toast('Backlog同期を継続実行します');
    } else {
      busy(true, 'Backlog同期完了。実績を再集計しています...');
      const cache = await rpc('rebuildAnalyticsCache');
      if (!cache || cache.ok === false) throw new Error(cache && cache.message ? cache.message : '実績の再集計を開始できませんでした。');
      toast(cache.continued ? '同期完了。実績の再集計を継続します' : '同期・実績再集計が完了しました');
    }
    await reloadCurrentPage();
  } catch (e) {
    toast(e.message, true);
  } finally {
    busy(false);
  }
}
