<script>
(function installPageCache() {
  const CACHE_TTL_MILLIS = 5 * 60 * 1000;
  const cache = {};
  const prefetchRequests = {};
  let lastCapturedView = null;

  const originalEnterDashboard = window.enterDashboard;
  const originalOpenPage = window.openPage;
  const originalReloadCurrentPage = window.reloadCurrentPage;

  function cacheKey(page, month) {
    const definition = CLIENT_PAGES[page];
    const period = definition && definition.monthIndependent
      ? 'global'
      : month;

    return page + ':' + period;
  }

  function saveCache(page, month, data) {
    cache[cacheKey(page, month)] = {
      data: data,
      savedAt: Date.now()
    };
  }

  function readCache(page, month) {
    return cache[cacheKey(page, month)] || null;
  }

  function deleteCache(page, month) {
    delete cache[cacheKey(page, month)];
  }

  function captureLastServerView() {
    const view = state.lastServerView;
    if (!view || view === lastCapturedView) return false;
    saveCache(view.page, view.month, view.data);
    lastCapturedView = view;
    return true;
  }

  function prefetchPages(month) {
    if (prefetchRequests[month]) {
      return prefetchRequests[month];
    }

    prefetchRequests[month] = rpc('getNavigationPrefetchData', month)
      .then(function handlePrefetchSuccess(result) {
        const pages = result.pages || {};

        Object.keys(pages).forEach(function savePage(page) {
          saveCache(page, result.month, pages[page]);
        });

        delete prefetchRequests[month];
        return result;
      })
      .catch(function handlePrefetchFailure() {
        delete prefetchRequests[month];
        return null;
      });

    return prefetchRequests[month];
  }

  window.enterDashboard = async function enterDashboardWithPrefetch() {
    const result = await originalEnterDashboard();

    if (state.boot) {
      captureLastServerView();
      const month = document.querySelector('#globalMonth').value || state.boot.currentMonth;
      window.setTimeout(function startPrefetch() {
        prefetchPages(month);
      }, 0);
    }
    return result;
  };

  window.openPage = async function openPageWithCache(page, historyMode = 'push') {
    const allowed = state.boot.pages.some(function(item) {
      return item.id === page && (!item.admin || state.boot.user.isAdmin);
    });
    if (!allowed) page = 'dashboard';
    const month = document.querySelector('#globalMonth').value;
    const cached = readCache(page, month);

    if (!cached) {
      const result = await originalOpenPage(page, historyMode);
      captureLastServerView();
      window.setTimeout(function warmSelectedMonth() {
        prefetchPages(month);
      }, 0);
      return result;
    }

    const stale = Date.now() - cached.savedAt > CACHE_TTL_MILLIS;
    state.page = page;
    updateRoute(historyMode);
    preparePageChrome(page);
    renderInitialPage(page, cached.data);

    if (stale) {
      prefetchPages(month);
    }
    return cached.data;
  };

  window.reloadCurrentPage = function reloadPageWithoutCache(pushHistory = false) {
    const month = document.querySelector('#globalMonth').value;
    deleteCache(state.page, month);

    return originalReloadCurrentPage(pushHistory);
  };

  // Direct URL startup can begin before this wrapper is installed. Poll only
  // until the initial server response is available, then warm the selected month.
  let warmupAttempts = 0;
  function warmInitialView() {
    if (state.boot && document.querySelector('#globalMonth').value) {
      captureLastServerView();
      prefetchPages(document.querySelector('#globalMonth').value);
      return;
    }
    warmupAttempts++;
    if (warmupAttempts < 200) window.setTimeout(warmInitialView, 50);
  }
  window.setTimeout(warmInitialView, 0);
})();
</script>
